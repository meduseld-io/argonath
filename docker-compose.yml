services:
  argonath:
    image: ghcr.io/meduseld-io/argonath:latest
    container_name: argonath
    # build: .  # Uncomment for local development
    ports:
      - "5000:5000"
    pid: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./game:/game
      - ./config:/config
      - argonath-data:/data
    environment:
      - TZ=America/New_York
      # - SECRET_KEY=change-me-to-something-random
      # - IDLE_SHUTDOWN_MINUTES=15
    restart: unless-stopped

volumes:
  argonath-data:
