<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ game_name }} | Argonath</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack-extra.min.css">
    <script>
        // Apply saved theme before paint to prevent flash
        (function() {
            const accent = localStorage.getItem('argonath_accent');
            const bg = localStorage.getItem('argonath_bg');
            if (accent) document.documentElement.style.setProperty('--accent', accent);
            if (bg) document.documentElement.style.setProperty('--bg', bg);
        })();
    </script>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="header-titles">
                <h1>Argonath</h1>
                <span class="game-name">{{ game_name }}</span>
            </div>
            <span class="badge" id="state-badge">offline</span>
        </div>
        <div class="header-right">
            {% if auth_mode != 'none' %}
            <span class="user-info">{{ user.username }} ({{ user.role }})</span>
            {% endif %}
            <button class="settings-toggle" id="settings-btn" aria-label="Settings">&#9881;</button>
            {% if auth_mode != 'none' %}
            <a href="/logout" class="btn btn-sm">Logout</a>
            {% endif %}
        </div>
    </header>

    <main>
        <div class="grid-stack" id="dashboard-grid">
        </div>

        <!-- Footer -->
        <footer class="panel-footer">
            <a href="https://github.com/meduseld-io/argonath" target="_blank"><img src="/static/logo.png" alt="Argonath" class="footer-logo"></a>
            <p class="footer-text">&copy; <span id="footer-year"></span> <a href="https://github.com/meduseld-io" target="_blank">meduseld.io</a></p>
        </footer>
    </main>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Settings Modal -->
    <div class="settings-overlay" id="settings-overlay">
        <div class="settings-modal">
            <h2>Dashboard Settings</h2>

            <div class="settings-section">
                <h4>Accent Colour</h4>
                <div class="color-presets" id="accent-presets"></div>
                <div class="color-input-row">
                    <label for="accent-custom">Custom:</label>
                    <input type="color" id="accent-custom" value="#8a8a8a">
                </div>
            </div>

            <div class="settings-section">
                <h4>Background</h4>
                <div class="color-presets" id="bg-presets"></div>
                <div class="color-input-row">
                    <label for="bg-custom">Custom:</label>
                    <input type="color" id="bg-custom" value="#0d0d0d">
                </div>
            </div>

            <div class="settings-section">
                <h4>Layout</h4>
                <div class="lock-toggle">
                    <input type="checkbox" id="lock-layout" checked>
                    <label for="lock-layout">Lock layout (prevent drag/resize)</label>
                </div>
            </div>

            <div class="settings-actions">
                <button class="btn btn-secondary" id="settings-close">Close</button>
                <button class="btn btn-danger" id="settings-reset">Reset All</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack-all.js"></script>
    <script>
        const GAME_NAME = '{{ game_name }}';
        const MAX_PLAYERS = {{ max_players }};
        const STEAMCMD_ENABLED = {{ 'true' if steamcmd_enabled else 'false' }};
        const STEAM_APP_ID = '{{ steam_app_id }}';
        const PROCESS_NAME = '{{ process_name }}';
        const SERVER_ARGS = {{ server_args | tojson }};
        let isDeployed = true; // assume true until first stats fetch
        const GAME_PORT = (function() {
            for (let i = 0; i < SERVER_ARGS.length; i++) {
                const a = SERVER_ARGS[i];
                if (a.match && a.match(/-port[=:]/i)) return a.split(/[=:]/)[1];
                if (a.toLowerCase() === '-port' || a.toLowerCase() === '+server.port') return SERVER_ARGS[i+1] || '';
            }
            return '';
        })();
        const QUERY_PORT = (function() {
            for (let i = 0; i < SERVER_ARGS.length; i++) {
                const a = SERVER_ARGS[i];
                if (a.match && a.match(/-queryport[=:]/i)) return a.split(/[=:]/)[1];
                if (a.toLowerCase() === '-queryport' || a.toLowerCase() === '+server.queryport') return SERVER_ARGS[i+1] || '';
            }
            return '';
        })();
        let statsInterval, logsInterval, historyInterval;
        let cpuChart, ramChart;
        let lastState = '';
        let grid;

        // ================= WIDGET DEFINITIONS =================

        const DEFAULT_LAYOUT = [
            { id: 'status-cards', x: 0, y: 0, w: 12, h: 3, minW: 6, minH: 2 },
            { id: 'server-info', x: 0, y: 3, w: 6, h: 6, minW: 4, minH: 3 },
            { id: 'controls', x: 6, y: 3, w: 6, h: 2, minW: 4, minH: 2 },
            { id: 'quick-info', x: 6, y: 5, w: 6, h: 4, minW: 4, minH: 2 },
            { id: 'charts', x: 0, y: 9, w: 12, h: 7, minW: 6, minH: 5 },
            { id: 'server-logs', x: 0, y: 16, w: 6, h: 6, minW: 4, minH: 4 },
            { id: 'startup-logs', x: 6, y: 16, w: 6, h: 6, minW: 4, minH: 4 },
            { id: 'activity', x: 0, y: 22, w: 12, h: 5, minW: 6, minH: 3 }
        ];

        function getWidgetContent(id) {
            switch (id) {
                case 'status-cards':
                    return `
                        <div class="widget-header"><h3>System Status</h3><span class="drag-handle">&#9776;</span></div>
                        <section class="status-cards">
                            <div class="card"><div class="card-label">System CPU</div><div class="card-value" id="stat-cpu">--%</div></div>
                            <div class="card"><div class="card-label">CPU Temp</div><div class="card-value" id="stat-temp">--°C</div></div>
                            <div class="card"><div class="card-label">System RAM</div><div class="card-value" id="stat-ram">-- / -- GB</div></div>
                            <div class="card"><div class="card-label">Disk</div><div class="card-value" id="stat-disk">-- / -- GB</div></div>
                            <div class="card"><div class="card-label">Server CPU</div><div class="card-value" id="stat-server-cpu">--</div></div>
                            <div class="card"><div class="card-label">Server RAM</div><div class="card-value" id="stat-server-ram">--</div></div>
                        </section>`;
                case 'server-info':
                    return `
                        <div class="widget-header"><h3>Server Info</h3><span class="drag-handle">&#9776;</span></div>
                        <section class="server-info">
                            <div class="info-row"><span>State:</span><span id="server-state-text" class="badge">--</span></div>
                            <div class="info-row"><span>Players:</span><span id="player-count">-- / ${MAX_PLAYERS}</span></div>
                            <div class="info-row"><span>Uptime:</span><span id="uptime">--</span></div>
                            <div class="info-row"><span>Health:</span><span id="health" class="badge">--</span></div>
                            ${STEAMCMD_ENABLED ? '<div class="info-row"><span>Build:</span><span id="build-info">--</span></div>' : ''}
                            <div class="info-row"><span>Last Restart:</span><span id="last-restart">--</span></div>
                        </section>`;
                case 'controls':
                    return `
                        <div class="widget-header"><h3>Controls</h3><span class="drag-handle">&#9776;</span></div>
                        <section class="controls" id="controls-section">
                            <button class="btn btn-start" id="btn-start" onclick="serverAction('start')">Start</button>
                            <button class="btn btn-stop" id="btn-stop" onclick="serverAction('stop')">Stop</button>
                            <button class="btn btn-restart" id="btn-restart" onclick="serverAction('restart')">Restart</button>
                            <button class="btn btn-kill" id="btn-kill" onclick="serverAction('kill')">Kill</button>
                            <button class="btn btn-backup" id="btn-backup" onclick="backupAction()">Backup</button>
                        </section>
                        <section class="controls deploy-section" id="deploy-section" style="display:none">
                            <button class="btn btn-start" id="btn-deploy" onclick="deployAction()">Deploy Server</button>
                            <span class="deploy-hint" id="deploy-hint">Server files not installed</span>
                            <span class="deploy-status" id="deploy-status" style="display:none">Deploying...</span>
                        </section>`;
                case 'quick-info':
                    return `
                        <div class="widget-header"><h3>Config</h3><span class="drag-handle">&#9776;</span></div>
                        <section class="quick-info">
                            ${STEAM_APP_ID ? '<div class="qi-row"><span class="qi-label">App ID</span><span class="qi-value">' + STEAM_APP_ID + '</span></div>' : ''}
                            <div class="qi-row"><span class="qi-label">Process</span><span class="qi-value">${PROCESS_NAME}</span></div>
                            ${GAME_PORT ? '<div class="qi-row"><span class="qi-label">Port</span><span class="qi-value">' + GAME_PORT + '</span></div>' : ''}
                            ${QUERY_PORT ? '<div class="qi-row"><span class="qi-label">Query</span><span class="qi-value">' + QUERY_PORT + '</span></div>' : ''}
                            <div class="qi-row"><span class="qi-label">Max Players</span><span class="qi-value">${MAX_PLAYERS}</span></div>
                        </section>`;
                case 'charts':
                    return `
                        <div class="widget-header"><h3>Performance</h3><span class="chart-legend"><span class="legend-item"><span class="legend-dot legend-dot-accent" style="background:var(--accent)"></span>System</span><span class="legend-item"><span class="legend-dot" style="background:#4caf50"></span>Server</span></span><span class="drag-handle">&#9776;</span></div>
                        <section class="charts">
                            <div class="chart-container"><h3>CPU Usage</h3><canvas id="chart-cpu"></canvas></div>
                            <div class="chart-container"><h3>RAM Usage</h3><canvas id="chart-ram"></canvas></div>
                        </section>`;
                case 'server-logs':
                    return `
                        <div class="widget-header"><h3>Server Logs</h3><span class="drag-handle">&#9776;</span></div>
                        <section class="logs-section">
                            <div class="log-viewer" id="log-viewer"><pre id="log-content">Loading...</pre></div>
                        </section>`;
                case 'startup-logs':
                    return `
                        <div class="widget-header"><h3>Startup Logs</h3><span class="drag-handle">&#9776;</span></div>
                        <section class="logs-section">
                            <div class="log-viewer" id="startup-log-viewer"><pre id="startup-log-content">Loading...</pre></div>
                        </section>`;
                case 'activity':
                    return `
                        <div class="widget-header"><h3>Activity Log</h3><span class="drag-handle">&#9776;</span></div>
                        <section class="logs-section">
                            <div class="activity-list" id="activity-list">Loading...</div>
                        </section>`;
                default:
                    return '';
            }
        }

        // ================= GRIDSTACK INIT =================

        function initGrid() {
            const savedLayout = localStorage.getItem('argonath_layout');
            const layout = savedLayout ? JSON.parse(savedLayout) : DEFAULT_LAYOUT;
            const locked = localStorage.getItem('argonath_layout_locked') !== 'false';

            grid = GridStack.init({
                column: 12,
                cellHeight: 40,
                margin: 4,
                animate: false,
                draggable: { handle: '.widget-header' },
                resizable: { handles: 'se,sw' },
                disableDrag: locked,
                disableResize: locked,
                float: true
            }, '#dashboard-grid');

            // Add widgets
            layout.forEach(item => {
                grid.addWidget({
                    id: item.id,
                    x: item.x,
                    y: item.y,
                    w: item.w,
                    h: item.h,
                    minW: item.minW || 4,
                    minH: item.minH || 2,
                    content: getWidgetContent(item.id)
                });
            });

            // Save layout on change
            grid.on('change', saveLayout);

            if (locked) {
                document.querySelector('main').classList.add('layout-locked');
            }
        }

        function saveLayout() {
            const items = grid.getGridItems().map(el => {
                const node = el.gridstackNode;
                return {
                    id: node.id,
                    x: node.x,
                    y: node.y,
                    w: node.w,
                    h: node.h,
                    minW: node.minW,
                    minH: node.minH
                };
            });
            localStorage.setItem('argonath_layout', JSON.stringify(items));
        }

        function setLayoutLocked(locked) {
            localStorage.setItem('argonath_layout_locked', locked ? 'true' : 'false');
            if (locked) {
                grid.enableMove(false);
                grid.enableResize(false);
                document.querySelector('main').classList.add('layout-locked');
            } else {
                grid.enableMove(true);
                grid.enableResize(true);
                document.querySelector('main').classList.remove('layout-locked');
            }
        }

        // ================= COLOUR CUSTOMISATION =================

        const ACCENT_PRESETS = [
            { name: 'Stone', value: '#8a8a8a' },
            { name: 'Gold', value: '#c9a227' },
            { name: 'Blue', value: '#2196f3' },
            { name: 'Teal', value: '#009688' },
            { name: 'Green', value: '#4caf50' },
            { name: 'Purple', value: '#9c27b0' },
            { name: 'Red', value: '#e53935' },
            { name: 'Orange', value: '#ff9800' },
            { name: 'Pink', value: '#e91e63' },
            { name: 'Cyan', value: '#00bcd4' }
        ];

        const BG_PRESETS = [
            { name: 'Charcoal', value: '#0d0d0d' },
            { name: 'Midnight', value: '#0a0f1a' },
            { name: 'Deep Green', value: '#0a1a0f' },
            { name: 'Dark Navy', value: '#0d1117' },
            { name: 'Slate', value: '#1a1a2e' },
            { name: 'Dark Brown', value: '#1a1008' },
            { name: 'Pure Black', value: '#000000' },
            { name: 'Warm Grey', value: '#1c1c1c' }
        ];

        function hexToHsl(hex) {
            let r = parseInt(hex.slice(1, 3), 16) / 255;
            let g = parseInt(hex.slice(3, 5), 16) / 255;
            let b = parseInt(hex.slice(5, 7), 16) / 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max === min) { h = s = 0; }
            else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    case b: h = ((r - g) / d + 4) / 6; break;
                }
            }
            return { h: h * 360, s: s * 100, l: l * 100 };
        }

        function hslToHex(h, s, l) {
            s /= 100; l /= 100;
            const a = s * Math.min(l, 1 - l);
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        function applyAccentColour(hex) {
            const hsl = hexToHsl(hex);
            const bright = hslToHex(hsl.h, Math.min(hsl.s + 10, 100), Math.min(hsl.l + 15, 85));
            const dim = hslToHex(hsl.h, Math.max(hsl.s - 15, 20), Math.max(hsl.l - 20, 15));
            document.documentElement.style.setProperty('--accent', hex);
            document.documentElement.style.setProperty('--accent-bright', bright);
            document.documentElement.style.setProperty('--accent-dim', dim);
            localStorage.setItem('argonath_accent', hex);
            updateActivePreset('accent');
            // Update chart line colours
            if (cpuChart) {
                cpuChart.data.datasets[0].borderColor = hex;
                cpuChart.update();
            }
            if (ramChart) {
                ramChart.data.datasets[0].borderColor = hex;
                ramChart.update();
            }
            // Update legend dots
            document.querySelectorAll('.legend-dot-accent').forEach(el => { el.style.background = hex; });
        }

        function applyBgColour(hex) {
            const hsl = hexToHsl(hex);
            const elevated = hslToHex(hsl.h, hsl.s, Math.min(hsl.l + 3, 20));
            const card = hslToHex(hsl.h, hsl.s, Math.min(hsl.l + 5, 22));
            const input = hslToHex(hsl.h, hsl.s, Math.min(hsl.l + 8, 25));
            const border = hslToHex(hsl.h, hsl.s, Math.min(hsl.l + 12, 28));
            const borderLight = hslToHex(hsl.h, hsl.s, Math.min(hsl.l + 16, 32));
            document.documentElement.style.setProperty('--bg', hex);
            document.documentElement.style.setProperty('--bg-elevated', elevated);
            document.documentElement.style.setProperty('--bg-card', card);
            document.documentElement.style.setProperty('--bg-input', input);
            document.documentElement.style.setProperty('--border', border);
            document.documentElement.style.setProperty('--border-light', borderLight);
            localStorage.setItem('argonath_bg', hex);
            updateActivePreset('bg');
        }

        function updateActivePreset(type) {
            const container = document.getElementById(type === 'accent' ? 'accent-presets' : 'bg-presets');
            const saved = localStorage.getItem(type === 'accent' ? 'argonath_accent' : 'argonath_bg');
            container.querySelectorAll('.color-preset').forEach(el => {
                el.classList.toggle('active', el.dataset.value === saved);
            });
        }

        function initSettings() {
            // Build accent presets
            const accentContainer = document.getElementById('accent-presets');
            ACCENT_PRESETS.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'color-preset';
                btn.style.background = p.value;
                btn.dataset.value = p.value;
                btn.title = p.name;
                btn.setAttribute('aria-label', p.name);
                btn.addEventListener('click', () => applyAccentColour(p.value));
                accentContainer.appendChild(btn);
            });

            // Build bg presets
            const bgContainer = document.getElementById('bg-presets');
            BG_PRESETS.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'color-preset';
                btn.style.background = p.value;
                btn.dataset.value = p.value;
                btn.title = p.name;
                btn.setAttribute('aria-label', p.name);
                btn.addEventListener('click', () => applyBgColour(p.value));
                bgContainer.appendChild(btn);
            });

            // Custom colour inputs
            document.getElementById('accent-custom').addEventListener('input', (e) => applyAccentColour(e.target.value));
            document.getElementById('bg-custom').addEventListener('input', (e) => applyBgColour(e.target.value));

            // Load saved colours
            const savedAccent = localStorage.getItem('argonath_accent');
            const savedBg = localStorage.getItem('argonath_bg');
            if (savedAccent) {
                applyAccentColour(savedAccent);
                document.getElementById('accent-custom').value = savedAccent;
            }
            if (savedBg) {
                applyBgColour(savedBg);
                document.getElementById('bg-custom').value = savedBg;
            }
            updateActivePreset('accent');
            updateActivePreset('bg');

            // Lock toggle
            const lockCheckbox = document.getElementById('lock-layout');
            const locked = localStorage.getItem('argonath_layout_locked') !== 'false';
            lockCheckbox.checked = locked;
            lockCheckbox.addEventListener('change', (e) => setLayoutLocked(e.target.checked));

            // Open/close settings
            document.getElementById('settings-btn').addEventListener('click', () => {
                document.getElementById('settings-overlay').classList.add('open');
            });
            document.getElementById('settings-close').addEventListener('click', () => {
                document.getElementById('settings-overlay').classList.remove('open');
            });
            document.getElementById('settings-overlay').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) {
                    document.getElementById('settings-overlay').classList.remove('open');
                }
            });

            // Reset
            document.getElementById('settings-reset').addEventListener('click', () => {
                if (!confirm('Reset all customisations to defaults? This will restore the default colour scheme and layout.')) return;
                localStorage.removeItem('argonath_accent');
                localStorage.removeItem('argonath_bg');
                localStorage.removeItem('argonath_layout');
                localStorage.removeItem('argonath_layout_locked');
                location.reload();
            });
        }

        // ================= CHARTS =================

        function initCharts() {
            const chartOpts = {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                layout: { padding: { top: 0, bottom: 5 } },
                scales: {
                    x: { display: false },
                    y: { beginAtZero: true, ticks: { color: '#555', font: { size: 10 } }, grid: { color: '#1f1f1f' } }
                },
                plugins: {
                    legend: { display: false }
                }
            };

            const cpuEl = document.getElementById('chart-cpu');
            const ramEl = document.getElementById('chart-ram');
            if (!cpuEl || !ramEl) return;

            cpuChart = new Chart(cpuEl, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'System', data: [], borderColor: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#c9a227', borderWidth: 1.5, fill: false, pointRadius: 0, tension: 0.3 },
                        { label: 'Server', data: [], borderColor: '#4caf50', borderWidth: 1.5, fill: false, pointRadius: 0, tension: 0.3 }
                    ]
                },
                options: { ...chartOpts, scales: { ...chartOpts.scales, y: { ...chartOpts.scales.y, max: 100 } } }
            });

            ramChart = new Chart(ramEl, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'System', data: [], borderColor: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#c9a227', borderWidth: 1.5, fill: false, pointRadius: 0, tension: 0.3 },
                        { label: 'Server', data: [], borderColor: '#4caf50', borderWidth: 1.5, fill: false, pointRadius: 0, tension: 0.3 }
                    ]
                },
                options: chartOpts
            });
        }

        function updateCharts(history) {
            if (!cpuChart || !ramChart) return;
            const labels = history.map(h => h.timestamp);
            cpuChart.data.labels = labels;
            cpuChart.data.datasets[0].data = history.map(h => h.system_cpu);
            cpuChart.data.datasets[1].data = history.map(h => h.server_cpu);
            cpuChart.update();

            ramChart.data.labels = labels;
            ramChart.data.datasets[0].data = history.map(h => h.system_ram);
            ramChart.data.datasets[1].data = history.map(h => h.server_ram);
            ramChart.update();
        }

        // ================= STATS POLLING =================

        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                if (!res.ok) return;
                const data = await res.json();

                // State badge
                const badge = document.getElementById('state-badge');
                badge.textContent = data.state;
                badge.className = 'badge state-' + data.state;

                // State text in server info
                const stateTextEl = document.getElementById('server-state-text');
                if (stateTextEl) {
                    const stateLabels = { running: 'Running', offline: 'Offline', crashed: 'Crashed', starting: 'Starting', stopping: 'Stopping', restarting: 'Restarting' };
                    stateTextEl.textContent = stateLabels[data.state] || data.state;
                    stateTextEl.className = 'badge state-' + data.state;
                }

                // Dynamic tab title
                const icons = { running: '🟢', offline: '🔴', crashed: '💥', starting: '🟡', stopping: '🟠', restarting: '🟡' };
                document.title = `${icons[data.state] || ''} ${GAME_NAME} | Argonath`;

                // System stats
                if (data.stats) {
                    const cpuEl = document.getElementById('stat-cpu');
                    const tempEl = document.getElementById('stat-temp');
                    const ramEl = document.getElementById('stat-ram');
                    const diskEl = document.getElementById('stat-disk');
                    if (cpuEl) cpuEl.textContent = data.stats.cpu.toFixed(1) + '%';
                    if (tempEl) {
                        tempEl.textContent = data.stats.cpu_temp !== null ? data.stats.cpu_temp + '°C' : 'N/A';
                        tempEl.classList.remove('temp-ok', 'temp-warn', 'temp-hot');
                        if (data.stats.cpu_temp !== null) {
                            if (data.stats.cpu_temp >= 75) tempEl.classList.add('temp-hot');
                            else if (data.stats.cpu_temp >= 60) tempEl.classList.add('temp-warn');
                            else tempEl.classList.add('temp-ok');
                        }
                    }
                    if (ramEl) ramEl.textContent = data.stats.ram_used.toFixed(1) + ' / ' + data.stats.ram_total.toFixed(1) + ' GB';
                    if (diskEl) diskEl.textContent = data.stats.disk_used.toFixed(0) + ' / ' + data.stats.disk_total.toFixed(0) + ' GB';
                }

                // Server stats
                const serverCpuEl = document.getElementById('stat-server-cpu');
                const serverRamEl = document.getElementById('stat-server-ram');
                if (data.server) {
                    if (serverCpuEl) serverCpuEl.textContent = data.server.cpu_raw.toFixed(1) + '%';
                    if (serverRamEl) serverRamEl.textContent = data.server.ram.toFixed(2) + ' GB';
                } else {
                    if (serverCpuEl) serverCpuEl.textContent = '--';
                    if (serverRamEl) serverRamEl.textContent = '--';
                }

                // Uptime
                const uptimeEl = document.getElementById('uptime');
                if (uptimeEl) uptimeEl.textContent = formatUptime(data.uptime || 0);

                // Last restart
                const lastRestartEl = document.getElementById('last-restart');
                if (lastRestartEl) {
                    if (data.uptime && data.state === 'running') {
                        const restartTime = new Date(Date.now() - data.uptime * 1000);
                        lastRestartEl.textContent = restartTime.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    } else {
                        lastRestartEl.textContent = '--';
                    }
                }

                // Player count
                const playerEl = document.getElementById('player-count');
                if (playerEl) {
                    if (data.state === 'running' && data.players !== undefined && data.players !== null) {
                        playerEl.textContent = data.players + ' / ' + MAX_PLAYERS;
                        playerEl.style.color = data.players > 0 ? 'var(--green-bright)' : '';
                    } else if (data.state === 'running') {
                        playerEl.textContent = '? / ' + MAX_PLAYERS;
                        playerEl.style.color = '';
                    } else {
                        playerEl.textContent = '-- / ' + MAX_PLAYERS;
                        playerEl.style.color = '';
                    }
                }

                // Health
                const healthEl = document.getElementById('health');
                if (healthEl) {
                    healthEl.textContent = data.health || '--';
                    healthEl.className = 'badge health-' + (data.health || 'unknown');
                }

                // Build info
                const buildEl = document.getElementById('build-info');
                if (buildEl && data.version) {
                    if (data.version.update_available) {
                        buildEl.textContent = `Update available (${data.version.current_build} \u2192 ${data.version.latest_build})`;
                        buildEl.classList.add('update-available');
                    } else {
                        buildEl.textContent = data.version.current_build || 'Unknown';
                        buildEl.classList.remove('update-available');
                    }
                }

                // Button states
                updateButtons(data.state);
                updateDeployState(data.deployed);
                lastState = data.state;
            } catch (e) {
                console.error('Failed to fetch stats:', e);
            }
        }

        function updateButtons(state) {
            const start = document.getElementById('btn-start');
            const stop = document.getElementById('btn-stop');
            const restart = document.getElementById('btn-restart');
            const kill = document.getElementById('btn-kill');

            if (start) start.disabled = !['offline', 'crashed'].includes(state);
            if (stop) stop.disabled = !['running'].includes(state);
            if (restart) restart.disabled = !['running'].includes(state);
            if (kill) kill.disabled = !['running', 'restarting'].includes(state);
        }

        function updateDeployState(deployed) {
            const controlsSection = document.getElementById('controls-section');
            const deploySection = document.getElementById('deploy-section');
            if (!controlsSection || !deploySection) return;

            if (deployed === false) {
                controlsSection.style.display = 'none';
                deploySection.style.display = '';
                isDeployed = false;
            } else {
                controlsSection.style.display = '';
                deploySection.style.display = 'none';
                isDeployed = true;
            }
        }

        let _deployPollInterval = null;

        async function deployAction() {
            const btn = document.getElementById('btn-deploy');
            const hint = document.getElementById('deploy-hint');
            const status = document.getElementById('deploy-status');
            try {
                btn.disabled = true;
                btn.textContent = 'Deploying...';
                if (hint) hint.style.display = 'none';
                if (status) status.style.display = '';
                const res = await fetch('/api/deploy', { method: 'POST' });
                if (!res.ok) {
                    const data = await res.json();
                    showToast('Error: ' + (data.error || 'Deploy failed'), 'error');
                    btn.disabled = false;
                    btn.textContent = 'Deploy Server';
                    if (hint) hint.style.display = '';
                    if (status) status.style.display = 'none';
                    return;
                }
                showToast('Deploy started - downloading server files...', 'info');

                // Poll deploy status
                _deployPollInterval = setInterval(async () => {
                    try {
                        const statusRes = await fetch('/api/deploy/status');
                        const data = await statusRes.json();
                        const lastLine = data.output ? data.output.split('\n').pop() : 'Working...';
                        if (status) status.textContent = lastLine;

                        if (data.status === 'complete') {
                            clearInterval(_deployPollInterval);
                            showToast('Deploy complete! Server files installed.', 'success');
                            isDeployed = true;
                            setTimeout(fetchStats, 1000);
                        } else if (data.status.startsWith('failed')) {
                            clearInterval(_deployPollInterval);
                            showToast('Deploy failed: ' + data.status, 'error');
                            btn.disabled = false;
                            btn.textContent = 'Deploy Server';
                            if (hint) hint.style.display = '';
                            if (status) status.style.display = 'none';
                        }
                    } catch (e) {
                        console.error('Deploy status poll failed:', e);
                    }
                }, 2000);
            } catch (e) {
                console.error('Deploy action failed:', e);
                showToast('Failed to start deploy', 'error');
                btn.disabled = false;
                btn.textContent = 'Deploy Server';
            }
        }

        function formatUptime(seconds) {
            if (!seconds) return '--';
            const d = Math.floor(seconds / 86400);
            const h = Math.floor((seconds % 86400) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            let parts = [];
            if (d) parts.push(d + 'd');
            if (h) parts.push(h + 'h');
            if (m) parts.push(m + 'm');
            parts.push(s + 's');
            return parts.join(' ');
        }

        // ================= SERVER ACTIONS =================

        async function serverAction(action) {
            try {
                showToast(`${action.charAt(0).toUpperCase() + action.slice(1)}ing server...`, 'info');
                const res = await fetch('/api/' + action, { method: 'POST' });
                if (res.status === 429) {
                    const data = await res.json();
                    showToast('Cooldown active: ' + (data.remaining || 'wait') + 's remaining', 'error');
                } else if (!res.ok && res.status !== 204) {
                    const data = await res.json();
                    showToast('Error: ' + (data.error || 'Unknown error'), 'error');
                } else {
                    showToast(`Server ${action} initiated`, 'success');
                }
                setTimeout(fetchStats, 500);
                setTimeout(fetchActivity, 1000);
            } catch (e) {
                console.error('Server action failed:', e);
                showToast('Failed to execute action', 'error');
            }
        }

        async function backupAction() {
            const btn = document.getElementById('btn-backup');
            try {
                btn.disabled = true;
                btn.textContent = 'Backing up...';
                showToast('Starting backup...', 'info');
                const res = await fetch('/api/backup', { method: 'POST' });
                if (res.status === 409) {
                    showToast('Backup already in progress', 'error');
                } else if (!res.ok) {
                    const data = await res.json();
                    showToast('Error: ' + (data.error || 'Backup failed'), 'error');
                } else {
                    showToast('Backup started', 'success');
                    // Poll for completion
                    const pollBackup = setInterval(async () => {
                        try {
                            const statusRes = await fetch('/api/backup/status');
                            const status = await statusRes.json();
                            if (!status.in_progress) {
                                clearInterval(pollBackup);
                                btn.disabled = false;
                                btn.textContent = 'Backup';
                                showToast('Backup complete!', 'success');
                                setTimeout(fetchActivity, 500);
                            }
                        } catch (e) {
                            console.error('Backup status poll failed:', e);
                            clearInterval(pollBackup);
                            btn.disabled = false;
                            btn.textContent = 'Backup';
                        }
                    }, 2000);
                }
            } catch (e) {
                console.error('Backup action failed:', e);
                showToast('Failed to start backup', 'error');
            } finally {
                if (!btn.disabled) {
                    btn.disabled = false;
                    btn.textContent = 'Backup';
                }
            }
        }

        // ================= TOAST NOTIFICATIONS =================

        function showToast(message, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ================= ACTIVITY LOG =================

        async function fetchActivity() {
            try {
                const res = await fetch('/api/activity');
                if (!res.ok) return;
                const data = await res.json();
                const el = document.getElementById('activity-list');
                if (!el) return;
                if (!data.activity || !data.activity.length) {
                    el.innerHTML = '<div class="activity-empty">No activity yet</div>';
                    return;
                }
                el.innerHTML = data.activity.map(a => {
                    const time = new Date(a.timestamp + 'Z').toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    const user = a.username || 'System';
                    return `<div class="activity-item"><span class="activity-time">${time}</span><span class="activity-user">${user}</span><span class="activity-action">${a.action}</span></div>`;
                }).join('');
            } catch (e) {
                console.error('Failed to fetch activity:', e);
            }
        }

        // ================= LOGS =================

        async function fetchLogs() {
            try {
                const res = await fetch('/api/logs');
                if (!res.ok) return;
                const data = await res.json();
                const el = document.getElementById('log-content');
                const viewer = document.getElementById('log-viewer');
                if (!el || !viewer) return;
                const atBottom = viewer.scrollTop + viewer.clientHeight >= viewer.scrollHeight - 50;
                el.textContent = data.lines.join('\n') || 'No logs available';
                if (atBottom) viewer.scrollTop = viewer.scrollHeight;
            } catch (e) {
                console.error('Failed to fetch logs:', e);
            }
        }

        async function fetchStartupLogs() {
            try {
                const res = await fetch('/api/startup-logs');
                if (!res.ok) return;
                const data = await res.json();
                const el = document.getElementById('startup-log-content');
                if (el) el.textContent = data.lines.join('\n') || 'No startup logs';
            } catch (e) {
                console.error('Failed to fetch startup logs:', e);
            }
        }

        async function fetchHistory() {
            try {
                const res = await fetch('/api/history');
                if (!res.ok) return;
                const data = await res.json();
                if (data.history && data.history.length) updateCharts(data.history);
            } catch (e) {
                console.error('Failed to fetch history:', e);
            }
        }

        // ================= INIT =================

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('footer-year').textContent = new Date().getFullYear();

            // Init grid first so DOM is populated
            initGrid();

            // Then init settings (colours), charts, and start polling
            initSettings();
            initCharts();
            fetchStats();
            fetchLogs();
            fetchStartupLogs();
            fetchHistory();
            fetchActivity();

            statsInterval = setInterval(fetchStats, 5000);
            logsInterval = setInterval(() => { fetchLogs(); fetchStartupLogs(); }, 5000);
            historyInterval = setInterval(fetchHistory, 30000);
            setInterval(fetchActivity, 15000);
        });
    </script>
</body>
