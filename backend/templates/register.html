<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | {{ game_name }} - Argonath</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/style.css">
    <script>
        // Apply saved theme before paint
        (function() {
            const accent = localStorage.getItem('argonath_accent');
            const bg = localStorage.getItem('argonath_bg');
            if (accent) document.documentElement.style.setProperty('--accent', accent);
            if (bg) document.documentElement.style.setProperty('--bg', bg);
        })();
    </script>
</head>
<body class="auth-page">
    <div class="auth-container">
        <img src="/static/logo.png" alt="Argonath" class="auth-logo">
        <h1>{{ game_name }}</h1>
        <p class="subtitle">Create Account</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/register">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required minlength="3" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" name="confirm" required minlength="6" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>

        <p class="auth-link">Already have an account? <a href="/login">Log In</a></p>
        <p class="auth-note">First user to register becomes admin.</p>
    </div>
</body>
</html>
