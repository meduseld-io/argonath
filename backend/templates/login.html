<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | {{ game_name }} - Argonath</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        // Apply saved theme before paint
        (function() {
            const accent = localStorage.getItem('argonath_accent');
            const bg = localStorage.getItem('argonath_bg');
            if (accent) document.documentElement.style.setProperty('--accent', accent);
            if (bg) document.documentElement.style.setProperty('--bg', bg);
        })();
    </script>
</head>
<body class="auth-page">
    <div class="auth-container">
        <h1>{{ game_name }}</h1>
        <p class="subtitle">Argonath Game Panel</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary">Log In</button>
        </form>

        <p class="auth-link">No account? <a href="/register">Register</a></p>
    </div>
</body>
</html>
