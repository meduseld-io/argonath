# Arma 3 Dedicated Server
game:
  name: "Arma 3"
  steam_app_id: "233780"
  process_name: "arma3server_x64"
  launch_script: "/game/start.sh"
  server_dir: "/game"
  log_file: "/game/arma3server.rpt"
  max_players: 64
  args: ["-config=server.cfg", "-port=2302", "-name=server"]

server:
  port: 5000
  host: "0.0.0.0"

auth:
  mode: "local"

steamcmd:
  enabled: true
  install_dir: "/game"
  validate: true

compatibility:
  wine: false
