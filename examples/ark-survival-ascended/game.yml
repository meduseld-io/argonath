# ARK: Survival Ascended Dedicated Server (Wine/Proton required)
game:
  name: "ARK: Survival Ascended"
  steam_app_id: "2430930"
  process_name: "ArkAscendedServer.exe"
  launch_script: "/game/start.sh"
  server_dir: "/game"
  log_file: "/game/ShooterGame/Saved/Logs/ShooterGame.log"
  max_players: 70
  args: ["TheIsland_WP?listen?SessionName=MyServer?MaxPlayers=70", "-server", "-log", "-NoBattlEye"]

server:
  port: 5000
  host: "0.0.0.0"

auth:
  mode: "local"

steamcmd:
  enabled: true
  install_dir: "/game"
  validate: true

compatibility:
  wine: true
  proton_version: "GE-Proton10-32"
