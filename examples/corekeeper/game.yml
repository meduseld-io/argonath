# Core Keeper Dedicated Server
# Native Linux, but the server needs a virtual display (Xvfb), which is in the
# ghcr.io/meduseld-io/argonath:latest-wine image.
game:
  name: "Core Keeper"
  steam_app_id: "1963720"
  executable: "CoreKeeperServer"
  process_name: "CoreKeeperServer"
  xvfb: true
  env:
    LD_LIBRARY_PATH: ".:$LD_LIBRARY_PATH"
  args: ["-batchmode", "-logfile", "/game/logs/CoreKeeperServer.log", "-datapath", "/game/data"]
  log_file: "/game/logs/CoreKeeperServer.log"
  console_log: "/game/logs/console.log"
  max_players: 8

backup:
  save_dir: "/game/data"
