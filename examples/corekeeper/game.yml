# Core Keeper Dedicated Server
game:
  name: "Core Keeper"
  steam_app_id: "1963720"
  process_name: "CoreKeeperServer"
  launch_exe: "/game/CoreKeeperServer"
  server_dir: "/game"
  log_file: "/game/CoreKeeper/logs/CoreKeeperServer.log"
  max_players: 8
  args: ["-batchmode", "-logfile", "/game/CoreKeeper/logs/CoreKeeperServer.log"]

server:
  port: 5000
  host: "0.0.0.0"

auth:
  mode: "local"

steamcmd:
  enabled: true
  install_dir: "/game"
  validate: true

compatibility:
  wine: false
