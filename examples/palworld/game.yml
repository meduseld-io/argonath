# Palworld Dedicated Server
game:
  name: "Palworld"
  steam_app_id: "2394010"
  process_name: "PalServer-Linux-Shipping"
  launch_script: "/game/start.sh"
  server_dir: "/game"
  log_file: "/game/Pal/Saved/Logs/Pal.log"
  max_players: 32
  args: ["-port=8211", "-queryport=27015", "-useperfthreads", "-NoAsyncLoadingThread", "-UseMultithreadForDS"]

server:
  port: 5000
  host: "0.0.0.0"

auth:
  mode: "local"

steamcmd:
  enabled: true
  install_dir: "/game"
  validate: true

compatibility:
  wine: false
