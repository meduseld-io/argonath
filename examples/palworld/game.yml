# Palworld Dedicated Server
game:
  name: "Palworld"
  steam_app_id: "2394010"
  executable: "PalServer.sh"
  process_name: "PalServer-Linux-Shipping"
  args: ["-port=8211", "-queryport=27015", "-useperfthreads", "-NoAsyncLoadingThread",
         "-UseMultithreadForDS"]
  log_file: "/game/server.log"
  max_players: 32
  port: 8211
  port_protocol: "udp"
  query_port: 27015

backup:
  save_dir: "/game/Pal/Saved"
