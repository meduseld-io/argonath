# Unturned Dedicated Server
game:
  name: "Unturned"
  steam_app_id: "1110390"
  process_name: "Unturned.x86_64"
  launch_script: "/game/start.sh"
  server_dir: "/game"
  log_file: "/game/Servers/MyServer/Logs/Server.log"
  max_players: 24
  args: ["-batchmode", "-nographics", "+secureserver/MyServer"]

server:
  port: 5000
  host: "0.0.0.0"

auth:
  mode: "local"

steamcmd:
  enabled: true
  install_dir: "/game"
  validate: true

compatibility:
  wine: false
