# Unturned Dedicated Server
# The +SecureServer/<name> argument sets the server folder under Servers/.
game:
  name: "Unturned"
  steam_app_id: "1110390"
  executable: "ServerHelper.sh"
  process_name: "Unturned_Headless.x86_64"
  args: ["+SecureServer/MyServer"]
  log_file: "/game/Logs/Server.log"
  console_log: "/game/console.log"
  max_players: 24
  port: 27015
  port_protocol: "udp"
  query_port: 27016

backup:
  save_dir: "/game/Servers/MyServer"
