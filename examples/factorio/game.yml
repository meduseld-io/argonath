# Factorio Headless Server (not on SteamCMD - download it once, see README)
game:
  name: "Factorio"
  executable: "bin/x64/factorio"
  process_name: "bin/x64/factorio"
  args: ["--start-server-load-latest", "--server-settings", "/game/data/server-settings.json",
         "--port", "34197"]
  log_file: "/game/factorio-current.log"
  console_log: "/game/console.log"
  max_players: 16
  port: 34197
  port_protocol: "udp"

steamcmd:
  enabled: false

backup:
  save_dir: "/game/saves"
