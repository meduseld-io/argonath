# Don't Starve Together Dedicated Server
# Cluster files go in /game/.klei/DoNotStarveTogether/Cluster_1 (see README).
game:
  name: "Don't Starve Together"
  steam_app_id: "343050"
  executable: "bin64/dontstarve_dedicated_server_nullrenderer_x64"
  working_dir: "bin64"   # the server must run from its bin64 folder
  process_name: "dontstarve_dedicated_server_nullrenderer_x64"
  args: ["-persistent_storage_root", "/game/.klei", "-conf_dir", "DoNotStarveTogether",
         "-cluster", "Cluster_1", "-shard", "Master", "-console"]
  log_file: "/game/.klei/DoNotStarveTogether/Cluster_1/Master/server_log.txt"
  console_log: "/game/console.log"
  max_players: 6
  port: 10999
  port_protocol: "udp"

backup:
  save_dir: "/game/.klei/DoNotStarveTogether/Cluster_1"
