# Enshrouded Dedicated Server (Wine/Proton required)
game:
  name: "Enshrouded"
  steam_app_id: "2278520"
  process_name: "enshrouded_server.exe"
  launch_script: "/game/start.sh"
  server_dir: "/game"
  log_file: "/game/logs/enshrouded_server.log"
  max_players: 16
  args: []

server:
  port: 5000
  host: "0.0.0.0"

auth:
  mode: "local"

steamcmd:
  enabled: true
  install_dir: "/game"
  validate: true

compatibility:
  wine: true
  proton_version: "GE-Proton10-32"
