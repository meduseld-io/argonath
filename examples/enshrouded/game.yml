# Enshrouded Dedicated Server (Windows-only, runs under Wine)
# Needs the ghcr.io/meduseld-io/argonath:latest-wine image.
game:
  name: "Enshrouded"
  steam_app_id: "2278520"
  executable: "enshrouded_server.exe"
  process_name: "enshrouded_server.exe"
  log_file: "/game/logs/enshrouded_server.log"
  console_log: "/game/console.log"
  max_players: 16
  port: 15636
  port_protocol: "udp"
  query_port: 15637

backup:
  save_dir: "/game/savegame"

compatibility:
  wine: true
