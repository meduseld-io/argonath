# Left 4 Dead 2 Dedicated Server
game:
  name: "Left 4 Dead 2"
  steam_app_id: "222860"
  process_name: "srcds_linux"
  launch_script: "/game/start.sh"
  server_dir: "/game"
  log_file: "/game/left4dead2/logs/console.log"
  max_players: 8
  args: ["-game", "left4dead2", "+map", "c1m1_hotel", "+maxplayers", "8", "-port", "27015"]

server:
  port: 5000
  host: "0.0.0.0"

auth:
  mode: "local"

steamcmd:
  enabled: true
  install_dir: "/game"
  validate: true

compatibility:
  wine: false
