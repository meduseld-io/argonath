# Astroneer Dedicated Server (Wine/Proton required)
game:
  name: "Astroneer"
  steam_app_id: "728470"
  process_name: "AstroServer-Win64-Shipping.exe"
  launch_script: "/game/start.sh"
  server_dir: "/game"
  log_file: "/game/Astro/Saved/Logs/Astro.log"
  max_players: 8
  args: []

server:
  port: 5000
  host: "0.0.0.0"

auth:
  mode: "local"

steamcmd:
  enabled: true
  install_dir: "/game"
  validate: true

compatibility:
  wine: true
  proton_version: "GE-Proton10-32"
