# Conan Exiles Dedicated Server (Wine/Proton required)
game:
  name: "Conan Exiles"
  steam_app_id: "443030"
  process_name: "ConanSandboxServer.exe"
  launch_script: "/game/start.sh"
  server_dir: "/game"
  log_file: "/game/ConanSandbox/Saved/Logs/ConanSandbox.log"
  max_players: 40
  args: ["-log", "-MaxPlayers=40"]

server:
  port: 5000
  host: "0.0.0.0"

auth:
  mode: "local"

steamcmd:
  enabled: true
  install_dir: "/game"
  validate: true

compatibility:
  wine: true
  proton_version: "GE-Proton10-32"
