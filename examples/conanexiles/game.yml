# Conan Exiles Dedicated Server (Windows-only, runs under Wine)
# Needs the ghcr.io/meduseld-io/argonath:latest-wine image. Experimental.
game:
  name: "Conan Exiles"
  steam_app_id: "443030"
  executable: "ConanSandbox/Binaries/Win64/ConanSandboxServer-Win64-Shipping.exe"
  process_name: "ConanSandboxServer"
  args: ["-log", "-MaxPlayers=40"]
  log_file: "/game/ConanSandbox/Saved/Logs/ConanSandbox.log"
  console_log: "/game/console.log"
  max_players: 40
  port: 7777
  port_protocol: "udp"
  query_port: 27015
  stop_timeout: 120

backup:
  save_dir: "/game/ConanSandbox/Saved"

compatibility:
  wine: true
