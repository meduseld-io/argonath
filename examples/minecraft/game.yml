# Minecraft Java Edition Server
# Deploy downloads the latest server.jar from Mojang plus the Java runtime it
# needs. Update detection checks for new Minecraft releases every hour.
game:
  name: "Minecraft"
  executable: "jre/bin/java"
  process_name: "server.jar"
  # Raise -Xmx (max memory) for more players or mods
  args: ["-Xmx4G", "-Xms1G", "-jar", "server.jar", "nogui"]
  log_file: "/game/logs/latest.log"     # written by Minecraft itself
  console_log: "/game/logs/console.log"
  max_players: 20
  port: 25565
  port_protocol: "tcp"
  stop_timeout: 90

steamcmd:
  enabled: false

backup:
  save_dir: "/game/world"
