# Minecraft Java Edition Server
# Deploy downloads the latest server.jar from Mojang automatically.
# Update detection checks for new Minecraft releases every hour.
game:
  name: "Minecraft"
  steam_app_id: ""
  process_name: "java"
  launch_script: "/game/start.sh"
  server_dir: "/game"
  log_file: "/game/logs/latest.log"
  max_players: 20
  args: []

server:
  port: 5000
  host: "0.0.0.0"

auth:
  mode: "local"

steamcmd:
  enabled: false

compatibility:
  wine: false
