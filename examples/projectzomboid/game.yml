# Project Zomboid Dedicated Server
# Server data goes in /game/Zomboid. Change -adminpassword before the first start.
game:
  name: "Project Zomboid"
  steam_app_id: "380870"
  executable: "start-server.sh"
  process_name: "ProjectZomboid64"
  args: ["-servername", "MyServer", "-adminpassword", "changeme", "-cachedir=/game/Zomboid"]
  log_file: "/game/Zomboid/server-console.txt"
  console_log: "/game/console.log"
  max_players: 16
  port: 16261
  port_protocol: "udp"
  stop_timeout: 90

backup:
  save_dir: "/game/Zomboid/Saves"
