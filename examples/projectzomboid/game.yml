# Project Zomboid Dedicated Server
game:
  name: "Project Zomboid"
  steam_app_id: "380870"
  process_name: "ProjectZomboid64"
  launch_script: "/game/start-server.sh"
  server_dir: "/game"
  log_file: "/game/Zomboid/server-console.txt"
  max_players: 16
  args: ["-servername", "MyServer"]

server:
  port: 5000
  host: "0.0.0.0"

auth:
  mode: "local"

steamcmd:
  enabled: true
  install_dir: "/game"
  validate: true

compatibility:
  wine: false
