# Sons of the Forest Dedicated Server (Windows-only, runs under Wine)
# Needs the ghcr.io/meduseld-io/argonath:latest-wine image. Experimental.
game:
  name: "Sons of the Forest"
  steam_app_id: "2465200"
  executable: "SonsOfTheForestDS.exe"
  process_name: "SonsOfTheForestDS.exe"
  args: ["-userdatapath", "/game/userdata"]
  log_file: "/game/console.log"
  max_players: 8
  port: 8766
  port_protocol: "udp"
  query_port: 27016

backup:
  save_dir: "/game/userdata"

compatibility:
  wine: true
