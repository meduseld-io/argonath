# Icarus Dedicated Server (Wine/Proton required)
game:
  name: "Icarus"
  steam_app_id: "2089300"
  process_name: "IcarusServer-Win64-Shipping.exe"
  launch_script: "/game/start.sh"
  server_dir: "/game"
  log_file: "/game/Icarus/Saved/Logs/Icarus.log"
  max_players: 8
  args: ["-SteamServerName=MyServer", "-Port=17777", "-QueryPort=27015"]

server:
  port: 5000
  host: "0.0.0.0"

auth:
  mode: "local"

steamcmd:
  enabled: true
  install_dir: "/game"
  validate: true

compatibility:
  wine: true
  proton_version: "GE-Proton10-32"
