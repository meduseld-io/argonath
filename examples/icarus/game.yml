# Icarus Dedicated Server (Windows-only, runs under Wine)
# Needs the ghcr.io/meduseld-io/argonath:latest-wine image. Experimental.
game:
  name: "Icarus"
  steam_app_id: "2089300"
  executable: "Icarus/Binaries/Win64/IcarusServer-Win64-Shipping.exe"
  process_name: "IcarusServer-Win64-Shipping.exe"
  args: ["-SteamServerName=MyServer", "-Port=17777", "-QueryPort=27015", "-Log"]
  log_file: "/game/Icarus/Saved/Logs/Icarus.log"
  console_log: "/game/console.log"
  max_players: 8
  port: 17777
  port_protocol: "udp"
  query_port: 27015

backup:
  save_dir: "/game/Icarus/Saved"

compatibility:
  wine: true
