# Terraria Dedicated Server (not on anonymous SteamCMD - download it once, see README)
game:
  name: "Terraria"
  executable: "TerrariaServer.bin.x86_64"
  process_name: "TerrariaServer"
  args: ["-config", "/game/serverconfig.txt"]
  log_file: "/game/console.log"
  max_players: 8
  port: 7777
  port_protocol: "tcp"

steamcmd:
  enabled: false

backup:
  save_dir: "/game/Worlds"
