# Terraria Dedicated Server (tModLoader compatible)
game:
  name: "Terraria"
  steam_app_id: "105600"
  process_name: "TerrariaServer"
  launch_script: "/game/start.sh"
  server_dir: "/game"
  log_file: "/game/logs/server.log"
  max_players: 8
  args: ["-config", "/game/serverconfig.txt"]

server:
  port: 5000
  host: "0.0.0.0"

auth:
  mode: "local"

steamcmd:
  enabled: true
  install_dir: "/game"
  validate: true

compatibility:
  wine: false
