# Rust Dedicated Server
game:
  name: "Rust"
  steam_app_id: "258550"
  executable: "RustDedicated"
  process_name: "RustDedicated"
  env:
    LD_LIBRARY_PATH: "./RustDedicated_Data/Plugins/x86_64:.:$LD_LIBRARY_PATH"
  args: ["-batchmode", "-logfile", "/game/logs/rust.log",
         "+server.port", "28015", "+server.queryport", "28017",
         "+server.level", "Procedural Map", "+server.seed", "12345", "+server.worldsize", "3000",
         "+server.maxplayers", "50", "+server.hostname", "MyServer",
         "+server.identity", "argonath"]
  log_file: "/game/logs/rust.log"
  console_log: "/game/logs/console.log"
  max_players: 50
  port: 28015
  port_protocol: "udp"
  query_port: 28017
  stop_timeout: 90

backup:
  save_dir: "/game/server/argonath"
