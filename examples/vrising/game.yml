# V Rising Dedicated Server (Windows-only, runs under Wine)
# Needs the ghcr.io/meduseld-io/argonath:latest-wine image.
game:
  name: "V Rising"
  steam_app_id: "1829350"
  executable: "VRisingServer.exe"
  process_name: "VRisingServer.exe"
  args: ["-persistentDataPath", "/game/save-data", "-serverName", "MyServer", "-saveName", "world1",
         "-logFile", "/game/logs/VRisingServer.log"]
  log_file: "/game/logs/VRisingServer.log"
  console_log: "/game/console.log"
  max_players: 40
  port: 9876
  port_protocol: "udp"
  query_port: 9877

backup:
  save_dir: "/game/save-data"

compatibility:
  wine: true
