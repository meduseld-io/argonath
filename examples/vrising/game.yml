# V Rising Dedicated Server (Wine/Proton required)
game:
  name: "V Rising"
  steam_app_id: "1829350"
  process_name: "VRisingServer.exe"
  launch_script: "/game/start.sh"
  server_dir: "/game"
  log_file: "/game/VRisingServer_Data/StreamingAssets/Settings/ServerGameSettings.json"
  max_players: 40
  args: ["-persistenceDataPath", "/game/save-data", "-serverName", "MyServer", "-saveName", "world1"]

server:
  port: 5000
  host: "0.0.0.0"

auth:
  mode: "local"

steamcmd:
  enabled: true
  install_dir: "/game"
  validate: true

compatibility:
  wine: true
  proton_version: "GE-Proton10-32"
