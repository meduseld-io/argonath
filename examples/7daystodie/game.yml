# 7 Days to Die Dedicated Server
game:
  name: "7 Days to Die"
  steam_app_id: "294420"
  process_name: "7DaysToDieServer.x86_64"
  launch_script: "/game/start.sh"
  server_dir: "/game"
  log_file: "/game/7DaysToDieServer_Data/output_log.txt"
  max_players: 8
  args: ["-configfile=/game/serverconfig.xml", "-logfile", "/game/7DaysToDieServer_Data/output_log.txt", "-quit", "-batchmode", "-nographics", "-dedicated"]

server:
  port: 5000
  host: "0.0.0.0"

auth:
  mode: "local"

steamcmd:
  enabled: true
  install_dir: "/game"
  validate: true

compatibility:
  wine: false
