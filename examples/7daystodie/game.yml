# 7 Days to Die Dedicated Server
# Use with GAME=7daystodie, or copy to config/game.yml to customise.
game:
  name: "7 Days to Die"
  steam_app_id: "294420"
  executable: "7DaysToDieServer.x86_64"
  process_name: "7DaysToDieServer.x86_64"
  env:
    LD_LIBRARY_PATH: ".:$LD_LIBRARY_PATH"
  args: ["-quit", "-batchmode", "-nographics", "-dedicated",
         "-configfile=serverconfig.xml", "-logfile", "/game/logs/output_log.txt"]
  log_file: "/game/logs/output_log.txt"
  console_log: "/game/logs/console.log"
  max_players: 8
  port: 26900
  port_protocol: "udp"
  query_port: 26900

backup:
  save_dir: "/game/.local/share/7DaysToDie"
