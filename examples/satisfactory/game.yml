# Satisfactory Dedicated Server
# The server is claimed and configured in-game on first connect (see README).
game:
  name: "Satisfactory"
  steam_app_id: "1690800"
  executable: "FactoryServer.sh"
  process_name: "FactoryServer-Linux-Shipping"
  args: ["-log", "-unattended"]
  log_file: "/game/FactoryGame/Saved/Logs/FactoryGame.log"
  console_log: "/game/console.log"
  max_players: 4
  port: 7777
  port_protocol: "udp"

backup:
  save_dir: "/game/.config/Epic/FactoryGame/Saved/SaveGames"
