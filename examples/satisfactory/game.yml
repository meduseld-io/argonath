# Satisfactory Dedicated Server
game:
  name: "Satisfactory"
  steam_app_id: "1690800"
  process_name: "FactoryServer"
  launch_exe: "/game/FactoryServer.sh"
  server_dir: "/game"
  log_file: "/game/FactoryGame/Saved/Logs/FactoryGame.log"
  max_players: 4

server:
  port: 5000
  host: "0.0.0.0"

auth:
  mode: "local"

steamcmd:
  enabled: true
  install_dir: "/game"
  validate: true

compatibility:
  wine: false
