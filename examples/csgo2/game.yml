# Counter-Strike 2 Dedicated Server
# Replace YOUR_GSLT_TOKEN with a Game Server Login Token (see README).
game:
  name: "Counter-Strike 2"
  steam_app_id: "730"
  executable: "game/cs2.sh"
  process_name: "linuxsteamrt64/cs2"
  args: ["-dedicated", "-port", "27015", "+game_type", "0", "+game_mode", "1",
         "+map", "de_dust2", "+sv_setsteamaccount", "YOUR_GSLT_TOKEN"]
  log_file: "/game/console.log"
  max_players: 10
  port: 27015
  port_protocol: "udp"
  query_port: 27015

backup:
  enabled: false
