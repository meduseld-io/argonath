<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🟢 Valheim | Argonath</title>
    <link rel="stylesheet" href="backend/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack-extra.min.css">
    <style>
        :root {
            --accent: #c9a227;
            --accent-bright: #e8c84a;
            --accent-dim: #3d3010;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="header-titles">
                <h1>Argonath</h1>
                <span class="game-name">Valheim</span>
            </div>
            <span class="badge state-running">running</span>
        </div>
        <div class="header-right">
            <span class="user-info">admin (admin)</span>
            <button class="settings-toggle" aria-label="Settings">&#9881;</button>
            <a href="#" class="btn btn-sm">Logout</a>
        </div>
    </header>

    <main>
        <div class="grid-stack" id="dashboard-grid"></div>
        <footer class="panel-footer">
            <img src="backend/static/logo.png" alt="Argonath" class="footer-logo">
            <p class="footer-text">&copy; 2026 <a href="https://github.com/meduseld-io" target="_blank">meduseld.io</a></p>
        </footer>
    </main>

    <div id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack-all.js"></script>
    <script>
        const DEFAULT_LAYOUT = [
            { id: 'status-cards', x: 0, y: 0, w: 12, h: 3, minW: 6, minH: 2 },
            { id: 'server-info', x: 0, y: 3, w: 6, h: 6, minW: 4, minH: 3 },
            { id: 'controls', x: 6, y: 3, w: 6, h: 2, minW: 4, minH: 2 },
            { id: 'quick-info', x: 6, y: 5, w: 6, h: 4, minW: 4, minH: 2 },
            { id: 'charts', x: 0, y: 9, w: 12, h: 7, minW: 6, minH: 5 },
            { id: 'server-logs', x: 0, y: 16, w: 6, h: 6, minW: 4, minH: 4 },
            { id: 'startup-logs', x: 6, y: 16, w: 6, h: 6, minW: 4, minH: 4 },
            { id: 'activity', x: 0, y: 22, w: 12, h: 5, minW: 6, minH: 3 }
        ];

        function getWidgetContent(id) {
            switch (id) {
                case 'status-cards':
                    return `
                        <div class="widget-header"><h3>System Status</h3></div>
                        <section class="status-cards">
                            <div class="card"><div class="card-label">System CPU</div><div class="card-value">31.7%</div></div>
                            <div class="card"><div class="card-label">CPU Temp</div><div class="card-value temp-ok">52°C</div></div>
                            <div class="card"><div class="card-label">System RAM</div><div class="card-value">14.2 / 32.0 GB</div></div>
                            <div class="card"><div class="card-label">Disk</div><div class="card-value">247 / 931 GB</div></div>
                            <div class="card"><div class="card-label">Server CPU</div><div class="card-value">72.6%</div></div>
                            <div class="card"><div class="card-label">Server RAM</div><div class="card-value">4.58 GB</div></div>
                        </section>`;
                case 'server-info':
                    return `
                        <div class="widget-header"><h3>Server Info</h3></div>
                        <section class="server-info">
                            <div class="info-row"><span>State:</span><span class="badge state-running">Running</span></div>
                            <div class="info-row"><span>Players:</span><span style="color:var(--green-bright)">4 / 10</span></div>
                            <div class="info-row"><span>Uptime:</span><span>1d 8h 52m 44s</span></div>
                            <div class="info-row"><span>Health:</span><span class="badge health-good">good</span></div>
                            <div class="info-row"><span>Build:</span><span>15891024</span></div>
                            <div class="info-row"><span>Last Restart:</span><span>Jul 15, 3:41 AM</span></div>
                        </section>`;
                case 'controls':
                    return `
                        <div class="widget-header"><h3>Controls</h3></div>
                        <section class="controls">
                            <button class="btn btn-start" disabled>Start</button>
                            <button class="btn btn-stop">Stop</button>
                            <button class="btn btn-restart">Restart</button>
                            <button class="btn btn-kill">Kill</button>
                            <button class="btn btn-backup">Backup</button>
                        </section>`;
                case 'quick-info':
                    return `
                        <div class="widget-header"><h3>Config</h3></div>
                        <section class="quick-info">
                            <div class="qi-row"><span class="qi-label">App ID</span><span class="qi-value">896660</span></div>
                            <div class="qi-row"><span class="qi-label">Process</span><span class="qi-value">valheim_server.x86_64</span></div>
                            <div class="qi-row"><span class="qi-label">Port</span><span class="qi-value">2456</span></div>
                            <div class="qi-row"><span class="qi-label">Query</span><span class="qi-value">2457</span></div>
                            <div class="qi-row"><span class="qi-label">Max Players</span><span class="qi-value">10</span></div>
                        </section>`;
                case 'charts':
                    return `
                        <div class="widget-header"><h3>Performance</h3><span class="chart-legend"><span class="legend-item"><span class="legend-dot" style="background:var(--accent)"></span>System</span><span class="legend-item"><span class="legend-dot" style="background:#4caf50"></span>Server</span></span></div>
                        <section class="charts">
                            <div class="chart-container"><h3>CPU Usage</h3><canvas id="chart-cpu"></canvas></div>
                            <div class="chart-container"><h3>RAM Usage</h3><canvas id="chart-ram"></canvas></div>
                        </section>`;
                case 'server-logs':
                    return `
                        <div class="widget-header"><h3>Server Logs</h3></div>
                        <section class="logs-section">
                            <div class="log-viewer"><pre>07/16/2026 12:34:18: Connections 4 ZDOS:41283 sent:512 recv:1247
07/16/2026 12:34:13: Connections 4 ZDOS:41281 sent:508 recv:1231
07/16/2026 12:33:59: Got character ZDOID from Thorin : 1587430921:1
07/16/2026 12:33:55: Got character ZDOID from Gandalf : 2938471023:3
07/16/2026 12:33:42: Connections 4 ZDOS:41276 sent:496 recv:1198
07/16/2026 12:33:37: Connections 4 ZDOS:41274 sent:491 recv:1182
07/16/2026 12:33:31: Connections 4 ZDOS:41272 sent:487 recv:1169
07/16/2026 12:33:08: RPC_PeerInfo from Legolas
07/16/2026 12:33:05: Got handshake from client 76561198045267
07/16/2026 12:32:44: Connections 3 ZDOS:41259 sent:462 recv:1103
07/16/2026 12:32:12: World saved ( 21.847s )
07/16/2026 12:31:38: Connections 3 ZDOS:41247 sent:448 recv:1078
07/16/2026 12:31:01: Connections 3 ZDOS:41235 sent:435 recv:1054</pre></div>
                        </section>`;
                case 'startup-logs':
                    return `
                        <div class="widget-header"><h3>Startup Logs</h3></div>
                        <section class="logs-section">
                            <div class="log-viewer"><pre>[2026-07-15 03:41:28] ✓ Server started successfully
[2026-07-15 03:41:28] Valheim dedicated server started on port 2456
[2026-07-15 03:41:25] DungeonDB Start 852
[2026-07-15 03:41:24] Loading 127 location zones
[2026-07-15 03:41:22] Initializing world "Midgard" (seed: meduseld2026)
[2026-07-15 03:41:18] SteamCMD update complete - build 15891024
[2026-07-15 03:41:02] Checking for updates via SteamCMD...
[2026-07-15 03:41:01] Starting Valheim dedicated server...
[2026-07-15 03:41:01] ──── SERVER START ────</pre></div>
                        </section>`;
                case 'activity':
                    return `
                        <div class="widget-header"><h3>Activity Log</h3></div>
                        <section class="logs-section">
                            <div class="activity-list">
                                <div class="activity-item"><span class="activity-time">Jul 16, 12:33 PM</span><span class="activity-user">System</span><span class="activity-action">Player joined: Legolas</span></div>
                                <div class="activity-item"><span class="activity-time">Jul 16, 10:15 AM</span><span class="activity-user">System</span><span class="activity-action">Player joined: Gandalf</span></div>
                                <div class="activity-item"><span class="activity-time">Jul 16, 8:42 AM</span><span class="activity-user">System</span><span class="activity-action">Player joined: Thorin</span></div>
                                <div class="activity-item"><span class="activity-time">Jul 15, 11:30 PM</span><span class="activity-user">System</span><span class="activity-action">Player left: Bilbo</span></div>
                                <div class="activity-item"><span class="activity-time">Jul 15, 7:18 PM</span><span class="activity-user">System</span><span class="activity-action">Player joined: Bilbo</span></div>
                                <div class="activity-item"><span class="activity-time">Jul 15, 4:05 PM</span><span class="activity-user">System</span><span class="activity-action">Backup completed</span></div>
                                <div class="activity-item"><span class="activity-time">Jul 15, 4:05 PM</span><span class="activity-user">admin</span><span class="activity-action">Backup started</span></div>
                                <div class="activity-item"><span class="activity-time">Jul 15, 3:41 AM</span><span class="activity-user">admin</span><span class="activity-action">Server started</span></div>
                                <div class="activity-item"><span class="activity-time">Jul 15, 3:40 AM</span><span class="activity-user">admin</span><span class="activity-action">Server stopped</span></div>
                            </div>
                        </section>`;
                default:
                    return '';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const grid = GridStack.init({
                column: 12,
                cellHeight: 40,
                margin: 4,
                animate: false,
                disableDrag: true,
                disableResize: true,
                float: true
            }, '#dashboard-grid');

            DEFAULT_LAYOUT.forEach(item => {
                grid.addWidget({
                    id: item.id,
                    x: item.x,
                    y: item.y,
                    w: item.w,
                    h: item.h,
                    minW: item.minW || 4,
                    minH: item.minH || 2,
                    content: getWidgetContent(item.id)
                });
            });

            document.querySelector('main').classList.add('layout-locked');

            // Generate fake chart data
            const chartOpts = {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                layout: { padding: { top: 0, bottom: 5 } },
                scales: {
                    x: { display: false },
                    y: { beginAtZero: true, ticks: { color: '#555', font: { size: 10 } }, grid: { color: '#1f1f1f' } }
                },
                plugins: { legend: { display: false } }
            };

            // Generate realistic-looking data
            function genData(base, variance, count) {
                const data = [];
                let val = base;
                for (let i = 0; i < count; i++) {
                    val += (Math.random() - 0.5) * variance;
                    val = Math.max(base - variance * 2, Math.min(base + variance * 2, val));
                    data.push(Math.round(val * 10) / 10);
                }
                return data;
            }

            const labels = Array.from({ length: 60 }, (_, i) => i);

            new Chart(document.getElementById('chart-cpu'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'System', data: genData(32, 6, 60), borderColor: '#c9a227', borderWidth: 1.5, fill: false, pointRadius: 0, tension: 0.3 },
                        { label: 'Server', data: genData(73, 7, 60), borderColor: '#4caf50', borderWidth: 1.5, fill: false, pointRadius: 0, tension: 0.3 }
                    ]
                },
                options: { ...chartOpts, scales: { ...chartOpts.scales, y: { ...chartOpts.scales.y, max: 100 } } }
            });

            new Chart(document.getElementById('chart-ram'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'System', data: genData(14.2, 0.4, 60), borderColor: '#c9a227', borderWidth: 1.5, fill: false, pointRadius: 0, tension: 0.3 },
                        { label: 'Server', data: genData(4.6, 0.2, 60), borderColor: '#4caf50', borderWidth: 1.5, fill: false, pointRadius: 0, tension: 0.3 }
                    ]
                },
                options: chartOpts
            });
        });
    </script>
</body>
</html>
